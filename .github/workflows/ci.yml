name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check backend tests scripts && ruff format --check backend tests scripts
      - name: Type check
        run: mypy backend
      - name: Test with coverage
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=90.01
      - name: Security (Bandit)
        run: bandit -r backend -x tests
      - name: Dependency audit
        run: pip-audit
      - name: Build Docker image
        run: docker build -t valkiria-invgate:ci .
