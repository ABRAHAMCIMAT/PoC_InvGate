name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      # Solo wheels con hash verificado (requirements-dev.lock): no se ejecutan scripts de instalación.
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock
      - name: Lint
        run: ruff check backend tests scripts && ruff format --check backend tests scripts
      - name: Type check
        run: mypy --explicit-package-bases backend
      - name: Test with coverage
        run: pytest --cov=backend --cov=scripts --cov-report=term-missing --cov-fail-under=90.01
      - name: Dependency audit
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip
      - name: Build Docker image
        run: docker build -t valkiria-invgate:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bandit depende de PyYAML, que no publica wheels para 3.15; Bandit solo lee el código fuente.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-security.lock
      - name: Security (Bandit)
        run: bandit -r backend scripts -x tests
