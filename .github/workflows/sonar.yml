name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=backend --cov=scripts --cov-report=xml:coverage.xml --cov-fail-under=90.01
      - name: Missing SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=SonarCloud omitido::Falta el secreto SONAR_TOKEN. Créalo en Settings > Secrets and variables > Actions con un token de sonarcloud.io (proyecto ABRAHAMCIMAT_PoC_InvGate)."
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
