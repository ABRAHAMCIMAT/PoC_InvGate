[project]
name = "valkiria-invgate"
version = "0.1.0"
description = "Sistema multiagente conversacional para InvGate Service Management (PoC)"
requires-python = ">=3.15"

[tool.ruff]
line-length = 110
target-version = "py315"
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "S"]
ignore = ["E501", "S101", "S105", "S106", "S108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "SIM117"]
"backend/security/*" = ["S105", "S106", "S110"]
"backend/server.py" = ["B008", "S110"]
"backend/security/auth.py" = ["B008"]
"backend/config.py" = ["S104"]
"backend/observability/*" = ["S110"]
"backend/llmops/patterns.py" = ["S110"]
"backend/llmops/errors.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts"]

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-q"]
markers = [
    "unit: pruebas unitarias rapidas",
    "integration: pruebas de integracion (API, agentes, adaptadores)",
    "e2e: flujo conversacional completo",
    "slow: pruebas lentas",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 90.01
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
