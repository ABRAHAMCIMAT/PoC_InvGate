<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valkiria InvGate PoC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Valkiria · InvGate PoC</h1>
        <p class="subtitle">Asistente multiagente de soporte</p>
      </div>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <details class="settings">
          <summary>API key</summary>
          <label for="api-key">Clave para la API (si está configurada)</label>
          <input id="api-key" type="password" autocomplete="off" placeholder="Bearer…" />
        </details>
      </nav>
    </header>

    <section class="agents" id="agents">
      <h2>Agentes</h2>
      <div class="agent-list" id="agent-list"></div>
      <p class="legend"><span class="dot ok"></span>correcto <span class="dot warning"></span>atención
        <span class="dot error"></span>falla <span class="dot pending"></span>pendiente</p>
    </section>

    <section class="ticket" id="ticket">
      <h2>Ticket</h2>
      <div id="ticket-info" class="ticket-info">Sin ticket aún.</div>
      <div id="approval-info" class="approval" hidden></div>
    </section>

    <section class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="sr-only">Describe tu problema</label>
        <input id="chat-input" type="text" placeholder="Describe tu problema…" autocomplete="off" maxlength="4000" />
        <button type="submit" id="send">Enviar</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
